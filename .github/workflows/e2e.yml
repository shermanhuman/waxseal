# .github/workflows/e2e.yml
# Smoke suite against a real sealed-secrets controller in kind. Runs on
# pushes to main and as a gate for releases; not on every PR push.
name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: helm/kind-action@v1
        with:
          config: tests/e2e/kind-config.yaml
          cluster_name: waxseal-e2e

      - name: Install the sealed-secrets controller
        run: |
          helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
          helm install sealed-secrets sealed-secrets/sealed-secrets \
            --namespace kube-system --version 2.17.4 --wait --timeout 180s

      - name: Install kubeseal
        run: |
          curl -sSfL -o kubeseal.tar.gz https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.30.0/kubeseal-0.30.0-linux-amd64.tar.gz
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 0755 kubeseal /usr/local/bin/kubeseal

      - name: Smoke test
        run: go test -tags e2e -v -timeout 15m ./tests/e2e/
