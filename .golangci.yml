version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - forbidigo
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      # Quickfix suggestions are style, not defects.
      checks: ["all", "-QF*", "-ST*"]
    forbidigo:
      forbid:
        # Layering rules. Output goes through ui.Printer; subprocesses
        # through proc; file writes through repo; exit codes through main.
        - pattern: ^fmt\.Print.*$
          msg: print through ui.Printer
        - pattern: ^os\.Exit$
          msg: return an error; cli.Main decides the exit code
        - pattern: ^exec\.Command(Context)?$
          msg: run subprocesses through internal/proc
        - pattern: ^os\.(WriteFile|Create|Rename|Remove|RemoveAll|MkdirAll)$
          msg: write files through internal/repo
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, forbidigo]
      - path: ^internal/ui/
        linters: [forbidigo]
      - path: ^internal/(proc|gcp)/
        linters: [forbidigo]
      - path: ^internal/repo/
        linters: [forbidigo]
      - path: ^internal/testutil/
        linters: [forbidigo]
      - path: ^cmd/
        linters: [forbidigo]
      - path: ^scripts/
        linters: [forbidigo]
